[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bikefit-agent"
version = "0.1.0"
description = "Autonomous Bike Fit Geometry & Cockpit Match Agent powered by Google ADK"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Dan Zaratsian"}
]
keywords = ["bike-fit", "geometry", "google-adk", "ai-agent", "gemini", "cycling"]
dependencies = [
    "google-adk>=2.0.0",
    "google-genai>=2.6.0",
    "pydantic>=2.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "flake8>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-v"

