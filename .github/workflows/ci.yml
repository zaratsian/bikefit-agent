name: CI / CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Conformance (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Syntax Check
        run: |
          # Verify clean Python compilation on all source files
          python -m py_compile bikefit_agent/*.py bikefit_agent/*/*.py tests/*.py run_agent.py
          # Flake8 syntax error check
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning check with permissive exit code
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Run Unit Test Suite with Pytest
        run: |
          pytest -v

      - name: Run Agent Demonstration Suite
        run: |
          python run_agent.py

      - name: Verify ADK Agent Conformance
        run: |
          python -c "import bikefit_agent; assert bikefit_agent.root_agent.name == 'bikefit_agent'; assert len(bikefit_agent.root_agent.tools) >= 8; assert len(bikefit_agent.root_agent.sub_agents) >= 2; print('✅ ADK Agent Conformance Verified!')"

  docker-build:
    name: Docker Container Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: bikefit-agent:latest
